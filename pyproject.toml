[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "normpic"
version = "0.1.0"
description = "Organize and rename photo collections with a consistent schema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "b3c32==0.0.2",
    "click>=8.3.0",
    "jsonschema>=4.25.1",
    "piexif>=1.1.3",
    "pillow>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.3",
    "psutil>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["normpic*"]

[tool.pytest.ini_options]
pythonpath = "."
norecursedirs = ["deleteme-normpic-modules", ".venv"] # Old deleteme, keep till gone

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["normpic", "test", "script"]
exclude = ["deleteme-normpic-modules", "**/__pycache__", ".venv"]
